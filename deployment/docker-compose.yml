version: "3.9"

# ── AI Fitness Trainer — Docker Compose  [v2 — Step 9 Updated] ───────────────
#
# Usage:
#   docker-compose up -d           # CPU mode
#   docker-compose --profile gpu up -d  # GPU mode
#
# ──────────────────────────────────────────────────────────────────────────────

services:

  api:
    build:
      context:    ..
      dockerfile: deployment/Dockerfile
    image: fitness-ai:latest
    container_name: fitness_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../model/checkpoints:/app/model/checkpoints:ro
      - ../data/processed:/app/data/processed:ro
      - ../models:/app/models:ro
      - pose_model_cache:/app/.pose_models
    env_file:
      - ../.env
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G
      # GPU — uncomment to enable:
      # reservations:
      #   devices:
      #     - driver: nvidia
      #       count: 1
      #       capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: fitness_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  pose_model_cache:
    driver: local
