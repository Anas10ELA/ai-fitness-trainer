# ── AI Fitness Trainer — Nginx Config ────────────────────────────────────────
#
# Features:
#   ✓ Reverse proxy to FastAPI on :8000
#   ✓ WebSocket upgrade (required for /stream endpoint)
#   ✓ Rate limiting (30 req/s per IP for HTTP, 10 connections for WS)
#   ✓ Gzip compression for JSON responses
#   ✓ Request size limit (10MB for base64 frames)
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ws_limit:10m;

upstream fitness_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # بدّل بالـ domain بتاعك لو عندك

    # Request size (base64 JPEG ~500KB → limit 10MB للأمان)
    client_max_body_size 10M;

    # Gzip
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 1000;

    # ── HTTP API endpoints ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://fitness_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /session/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://fitness_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location /exercises {
        proxy_pass       http://fitness_api;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass       http://fitness_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://fitness_api;
        proxy_set_header Host $host;
    }

    # ── WebSocket endpoint ─────────────────────────────────────────────────
    location /stream/ {
        limit_conn ws_limit 5;   # max 5 concurrent WS connections per IP

        proxy_pass              http://fitness_api;
        proxy_http_version      1.1;

        # WebSocket upgrade headers (REQUIRED)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Timeouts للـ long-lived WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # ── Default ────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://fitness_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
